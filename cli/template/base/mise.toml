# Every tool this project needs, pinned. `mise install` fetches them all.
# Rogen and the npm tools come from package.json, through `mise run install`.
[tools]
node = "24.22.1"
pnpm = "12.18.0"
# rbx-forge patches Rojo's Studio plugin to connect by itself, and supports the plugin of Rojo 7.7.0
# and 7.7.1. Before upgrading Rojo, check that rbx-forge supports the new version.
"github:rojo-rbx/rojo" = "7.7.1"
"github:howmanyslop/sloptor" = "2.8.3"
"github:lune-org/lune" = "0.11.1"
# ree runs the game offline for tests, rur renders UI, ror renders 3D. Anime-Vanguards tools.
"github:Anime-Vanguards/roblox-engine-emulator" = { version = "0.8.0", bin = "ree" }
"github:Anime-Vanguards/roblox-ui-renderer" = { version = "0.9.0", bin = "rur-native" }
"github:Anime-Vanguards/roblox-object-renderer" = { version = "0.7.0", bin = "ror" }

[settings]
# mise.lock records each tool's download and checksum for these platforms; `mise install` refuses a
# download that doesn't match. After changing a pin above, run `mise lock` and commit mise.lock.
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
# Syncback writes each new world instance as a readable .model.json instead of a binary .rbxm.
# Set for every task so forge's sync on save gets it too. It's Rojo's undocumented debug switch
# (src/syncback/mod.rs), not a stable option: check it still works when upgrading Rojo.
ROJO_SYNCBACK_DEBUG = "2"

[tasks.deps]
description = "Make node_modules match pnpm-lock.yaml; instant when it already does, so every task runs on the locked packages"
run = "pnpm install --frozen-lockfile --silent"

# Steps for one place run through scripts/each-place.ts: in the root for a single-place game, or
# in each projects/<place>/ for a multi-place one. There, $ROOT is the repo root.

[tasks.generate]
description = "Write the generated files of each place: default.project.json (code), game.project.json (code and world), src/world.d.ts (its map's types)"
depends = ["deps"]
run = '''node scripts/each-place.ts 'rogen write --quiet && node "$ROOT/scripts/game-project.ts" && node "$ROOT/scripts/world-types.ts"' '''

[tasks.install]
description = "Install packages, write the generated files, and set up this clone"
run = ["pnpm install --frozen-lockfile", "mise run generate", "mise run setup"]

[tasks.setup]
description = "Run the check before each commit, and give Claude Code the TypeScript language server; safe to rerun"
run = "node scripts/setup.ts"

[tasks.check]
description = "The one command to run after every change: format, compile, type-check the tooling, lint, build, verify each place and run the tests"
depends = ["generate"]
run = [
	"biome check --write --no-errors-on-unmatched .",
	# Tests named so they never run, and services nothing starts.
	"node scripts/check-sources.ts",
	"node scripts/each-place.ts 'sloptor build -p \"$TSCONFIG\" --rojo \"$PWD/default.project.json\" --includePath \"$ROOT/include\"'",
	"tsc -p tsconfig.node.json",
	# In a multi-place game, the shared code alone, so it can't lean on one place's map.
	"[ ! -d projects ] || tsc --noEmit -p tsconfig.json",
	"node scripts/each-place.ts 'rogen check'",
	# No --cache: type-aware rules depend on other files, which the cache doesn't track.
	"eslint --max-warnings 0 --no-error-on-unmatched-pattern src projects",
	'''node scripts/each-place.ts 'mkdir -p build && rojo build game.project.json --output build/game.rbxl && lune run "$ROOT/scripts/check-place" build/game.rbxl && node "$ROOT/scripts/test.ts" && node "$ROOT/scripts/ui.ts" --check' ''',
]

[tasks.ci]
description = "check, without writing fixes: fails on unformatted code"
depends = ["generate"]
run = [
	"biome ci .",
	# Tests named so they never run, and services nothing starts.
	"node scripts/check-sources.ts",
	"node scripts/each-place.ts 'sloptor build -p \"$TSCONFIG\" --rojo \"$PWD/default.project.json\" --includePath \"$ROOT/include\"'",
	"tsc -p tsconfig.node.json",
	# In a multi-place game, the shared code alone, so it can't lean on one place's map.
	"[ ! -d projects ] || tsc --noEmit -p tsconfig.json",
	"node scripts/each-place.ts 'rogen check'",
	"eslint --max-warnings 0 --no-error-on-unmatched-pattern src projects",
	'''node scripts/each-place.ts 'mkdir -p build && rojo build game.project.json --output build/game.rbxl && lune run "$ROOT/scripts/check-place" build/game.rbxl && node "$ROOT/scripts/test.ts" && node "$ROOT/scripts/ui.ts" --check' ''',
]

[tasks.test]
description = "Compile and run the tests offline in ree: Jest specs, except *.engine.spec, then tests/e2e"
depends = ["generate"]
run = '''node scripts/each-place.ts 'sloptor build -p "$TSCONFIG" --rojo "$PWD/default.project.json" --includePath "$ROOT/include" && node "$ROOT/scripts/test.ts"' '''

[tasks."test:engine"]
description = "Run every Jest spec, *.engine.spec included, in Roblox Studio or Open Cloud through jest-roblox"
depends = ["generate"]
# Your keys and local paths (copy .env.example to .env) reach only the tasks that use them, so the
# other tasks' tools never see them.
env = { _.file = ".env" }
run = "node scripts/each-place.ts 'sloptor build -p \"$TSCONFIG\" --rojo \"$PWD/default.project.json\" --includePath \"$ROOT/include\" && jest-roblox --passWithNoTests'"

[tasks.ui]
description = "Compile and render every UI story offline with rur; prints each picture's path"
depends = ["generate"]
env = { _.file = ".env" }
run = '''node scripts/each-place.ts 'sloptor build -p "$TSCONFIG" --rojo "$PWD/default.project.json" --includePath "$ROOT/include" && node "$ROOT/scripts/ui.ts"' '''

[tasks.dev]
description = "Start the dev session: compile on save, serve code to Studio, open Studio on the world, and sync each Studio save back to world/. A multi-place game names the place: mise run dev lobby"
depends = ["generate"]
usage = 'arg "[place]" help="The place, in a multi-place game"'
run = '''node scripts/each-place.ts --one "${usage_place:-}" 'forge start --syncback' '''

[tasks.sync]
description = "Save the Studio place, then write its world edits into world/ (while a forge session runs). A multi-place game names the place: mise run sync lobby"
usage = 'arg "[place]" help="The place, in a multi-place game"'
run = '''node scripts/each-place.ts --one "${usage_place:-}" 'forge save && forge sync' '''

[tasks.build]
description = "Compile and build the whole game, code and world, to build/game.rbxl (in each place's folder, in a multi-place game)"
depends = ["generate"]
run = "node scripts/each-place.ts 'sloptor build -p \"$TSCONFIG\" --rojo \"$PWD/default.project.json\" --includePath \"$ROOT/include\" && mkdir -p build && rojo build game.project.json --output build/game.rbxl'"
