name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test in ree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
        env:
          # mise downloads Rojo, Sloptor, ree and the rest from GitHub releases.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run install
      - run: mise run ci

  engine:
    # Every spec, *.engine.spec included, in a real Roblox engine through Open Cloud.
    # Set the secret ROBLOX_OPEN_CLOUD_API_KEY and the variables ROBLOX_UNIVERSE_ID and ROBLOX_PLACE_ID
    # (Settings > Secrets and variables > Actions); without the variables the job is skipped.
    name: Specs in Roblox (Open Cloud)
    needs: check
    runs-on: ubuntu-latest
    # Runs share the test place, so one at a time.
    concurrency:
      group: roblox-open-cloud
      cancel-in-progress: false
    # Without the variables, GitHub shows the job as skipped, not passed. With them but no key, the
    # specs fail. (A job's `if` can't read secrets; only the last step gets the key.)
    if: vars.ROBLOX_UNIVERSE_ID != '' && vars.ROBLOX_PLACE_ID != ''
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run install
      - run: mise run test:engine
        env:
          # The key only here: the steps before run installs and tools, which never see it.
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
