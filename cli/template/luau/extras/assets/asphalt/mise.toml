[tools]
# Asphalt uploads assets/ to Roblox and writes their IDs as a Luau module.
"github:jackTabsCode/asphalt" = "2.0.2"

[tasks.assets]
description = "Upload the new and changed files in assets/ to Roblox and write their IDs to src/Shared/Assets.luau; needs asphalt.toml's creator and ASPHALT_API_KEY in .env"
env = { _.file = ".env" }
run = "node scripts/assets.ts"
