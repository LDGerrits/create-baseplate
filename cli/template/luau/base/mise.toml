# Every tool this project needs, pinned. `mise install` fetches them all.
# Rogen, rbx-forge and the other Node tools come from package.json, and the game's Roblox packages
# from wally.toml, through `mise run install`.
[tools]
node = "24.22.1"
pnpm = "12.18.0"
# rbx-forge patches Rojo's Studio plugin to connect by itself, and supports the plugin of Rojo 7.7.0
# and 7.7.1. Before upgrading Rojo, check that rbx-forge supports the new version.
"github:rojo-rbx/rojo" = "7.7.1"
"github:UpliftGames/wally" = "0.3.2"
"github:JohnnyMorganz/wally-package-types" = "1.7.0"
"github:JohnnyMorganz/luau-lsp" = "1.70.1"
"github:JohnnyMorganz/StyLua" = "2.6.0"
# From aqua, which marks the binary executable; the GitHub release zip doesn't.
"aqua:Kampfkarren/selene" = "0.32.0"
"github:lune-org/lune" = "0.11.1"
# ree runs the game offline for tests, rur renders UI, ror renders 3D. Anime-Vanguards tools.
"github:Anime-Vanguards/roblox-engine-emulator" = { version = "0.8.0", bin = "ree" }
"github:Anime-Vanguards/roblox-ui-renderer" = { version = "0.9.0", bin = "rur-native" }
"github:Anime-Vanguards/roblox-object-renderer" = { version = "0.7.0", bin = "ror" }

[settings]
# mise.lock records each tool's download and checksum for these platforms; `mise install` refuses a
# download that doesn't match, and, being locked, a tool the lock doesn't list. After changing a pin
# above by hand, run `mise lock` and commit mise.lock; on Renovate's updates,
# .github/workflows/renovate-fixups.yml does it.
locked = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
# Syncback writes each new world instance as a readable .model.json instead of a binary .rbxm.
# Set for every task so forge's sync on save gets it too. It's Rojo's undocumented debug switch
# (src/syncback/mod.rs), not a stable option: check it still works when upgrading Rojo.
ROJO_SYNCBACK_DEBUG = "2"

[tasks.deps]
description = "Make node_modules match pnpm-lock.yaml and the Wally packages match wally.toml; instant when they already do, so every task runs on the locked packages"
run = ["pnpm install --frozen-lockfile --silent", "node scripts/packages.ts"]

# Steps for one place run through scripts/each-place.ts: in the root for a single-place game, or
# in each projects/<place>/ for a multi-place one. Each quoted step is a command run without a shell,
# so the tasks work the same in Windows' cmd and in sh; {root} is the repo root and {dir} the place's
# folder (see the script).

[tasks.generate]
description = "Write the generated files of each place: its code's project file (Rogen), game.project.json (code and world), sourcemap.json (every instance, for luau-lsp); then the packages' and Roblox's types"
depends = ["deps"]
run = [
	# At the root, Rogen writes the project file of each *.rogen.json: the game's, or each place's.
	"rogen write --quiet",
	'node scripts/each-place.ts "node {root}/scripts/game-project.ts" "rojo sourcemap game.project.json --include-non-scripts --output sourcemap.json"',
	"node scripts/packages.ts --types",
]

[tasks.install]
description = "Install packages, write the generated files, set up this clone, and bring the agent files up to the create-baseplate version package.json pins"
run = ["pnpm install --frozen-lockfile", "mise run generate", "mise run setup", "node scripts/agent-files.ts"]

[tasks.doc]
description = "Print a page of Baseplate's docs, for the create-baseplate version package.json pins: mise run doc testing. Without a topic, lists them"
usage = 'arg "[topic]" help="The page, such as testing, ui or publishing"'
run = 'node scripts/doc.ts {{usage.topic}}'

[tasks.setup]
description = "Run the check before each commit, restore the .claude/skills link on Windows clones without symbolic links, and give Claude Code the Luau language server; safe to rerun"
run = "node scripts/setup.ts"

[tasks.analyze]
description = "Type-check the game's Luau with luau-lsp, strict, against every instance in the game"
depends = ["generate"]
run = 'node scripts/each-place.ts "node {root}/scripts/analyze.ts"'

[tasks.check]
description = "The one command to run after every change: format, type-check, lint, build, verify each place and run the tests"
depends = ["generate"]
run = [
	"stylua .",
	"biome check --write --no-errors-on-unmatched .",
	# Tests named so they never run, services nothing starts, and remotes taken without a rate limit.
	"node scripts/check-sources.ts",
	# The agent files at the create-baseplate version package.json pins, and no clash left unmerged.
	"node scripts/agent-files.ts --check",
	"tsc -p tsconfig.node.json",
	# The agent hooks' and scripts' own tests.
	'node --test --test-reporter=dot ".agents/hooks/*.test.ts" "scripts/*.test.ts"',
	"rogen check",
	'node scripts/each-place.ts "node {root}/scripts/analyze.ts"',
	"selene src tests",
	'node scripts/each-place.ts "mkdir build" "rojo build game.project.json --output build/game.rbxl" "lune run {root}/scripts/check-place build/game.rbxl" "node {root}/scripts/test.ts" "node {root}/scripts/ui.ts --check"',
]

[tasks.ci]
description = "check, without writing fixes: fails on unformatted code"
depends = ["generate"]
run = [
	"stylua --check .",
	"biome ci .",
	# Tests named so they never run, services nothing starts, and remotes taken without a rate limit.
	"node scripts/check-sources.ts",
	# The agent files at the create-baseplate version package.json pins, and no clash left unmerged.
	"node scripts/agent-files.ts --check",
	"tsc -p tsconfig.node.json",
	# The agent hooks' and scripts' own tests.
	'node --test --test-reporter=dot ".agents/hooks/*.test.ts" "scripts/*.test.ts"',
	"rogen check",
	'node scripts/each-place.ts "node {root}/scripts/analyze.ts"',
	"selene src tests",
	'node scripts/each-place.ts "mkdir build" "rojo build game.project.json --output build/game.rbxl" "lune run {root}/scripts/check-place build/game.rbxl" "node {root}/scripts/test.ts" "node {root}/scripts/ui.ts --check"',
]

[tasks.test]
description = "Run the tests offline in ree: Jest specs, except *.engine.spec, then tests/e2e"
depends = ["generate"]
run = 'node scripts/each-place.ts "node {root}/scripts/test.ts"'

[tasks."test:engine"]
description = "Run every Jest spec, *.engine.spec included, in Roblox Studio or Open Cloud through jest-roblox"
depends = ["generate"]
# Your keys and local paths (copy .env.example to .env) reach only the tasks that use them, so the
# other tasks' tools never see them.
env = { _.file = ".env" }
run = 'node scripts/each-place.ts "jest-roblox --passWithNoTests" --'

[tasks.ui]
description = "Render every UI story offline with rur; prints each picture's path"
depends = ["generate"]
env = { _.file = ".env" }
run = 'node scripts/each-place.ts "node {root}/scripts/ui.ts" --'

[tasks.dev]
description = "Start the dev session: serve code to Studio, open Studio on the world, and sync each Studio save back to world/. A multi-place game names the place: mise run dev lobby"
depends = ["generate"]
usage = 'arg "[place]" help="The place, in a multi-place game"'
run = 'node scripts/each-place.ts --one "{{usage.place}}" "forge start --syncback"'

[tasks.sync]
description = "Save the Studio place, then write its world edits into world/ (while a forge session runs). A multi-place game names the place: mise run sync lobby"
usage = 'arg "[place]" help="The place, in a multi-place game"'
run = 'node scripts/each-place.ts --one "{{usage.place}}" "forge save" "forge sync"'

[tasks.build]
description = "Build the whole game, code and world, to build/game.rbxl (in each place's folder, in a multi-place game)"
depends = ["generate"]
run = 'node scripts/each-place.ts "mkdir build" "rojo build game.project.json --output build/game.rbxl"'

[tasks.publish]
description = "Build the game and publish it to Roblox through Open Cloud, to the place in ROBLOX_PUBLISH_PLACE_ID (see .env.example); .github/workflows/publish.yml runs it for dev, stable and prod"
depends = ["build"]
env = { _.file = ".env" }
run = 'node scripts/each-place.ts "node {root}/scripts/publish.ts build/game.rbxl"'
