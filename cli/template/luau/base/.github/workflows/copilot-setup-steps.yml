# Prepares GitHub Copilot's cloud coding agent: the pinned tools and packages, so it can run
# `mise run check` like any other agent. GitHub runs the job named copilot-setup-steps.
name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rur renders the stories in the check; the agent's machine has no GPU, so it needs Mesa's
      # Mesa's software Vulkan driver, installed while the rest sets up; `wait` is before the check.
      # Its .deb files are cached by runner image version, so most runs need no download.
      - id: mesa
        run: sh scripts/mesa.sh key >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mesa-debs
          key: ${{ steps.mesa.outputs.key }}
      - run: sh scripts/mesa.sh start
      # mise's version is the one .agents/hooks/cloud-setup.sh pins, which create-baseplate sync keeps current.
      - id: mise
        run: bash .agents/hooks/cloud-setup.sh --pin >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: ${{ steps.mise.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run install
      - run: sh scripts/mesa.sh wait
