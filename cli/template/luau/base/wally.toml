# The game's Roblox packages, from Wally. `mise run install` installs them into Packages/ (shared),
# ServerPackages/ (server only) and DevPackages/ (tests and stories), which default.rogen.json
# mounts. Pin exact versions (`=`); wally.lock records what they resolve to.
[package]
name = "local/game"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
private = true

# Where default.rogen.json mounts the shared packages, so server and dev packages find them.
[place]
shared-packages = "game.ReplicatedStorage.Packages"

[dependencies]
React = "jsdotlua/react@=17.2.1"
ReactRipple = "littensy/react-ripple@=3.0.1"
ReactRoblox = "jsdotlua/react-roblox@=17.2.1"
t = "osyrisrblx/t@=3.1.1"

[dev-dependencies]
Jest = "jsdotlua/jest@=3.10.0"
JestGlobals = "jsdotlua/jest-globals@=3.10.0"
UILabs = "pepeeltoro41/ui-labs@=2.4.2"
