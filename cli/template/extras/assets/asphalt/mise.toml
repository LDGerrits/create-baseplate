[tools]
# Asphalt uploads assets/ to Roblox and writes their IDs as code.
"github:jackTabsCode/asphalt" = "2.0.2"

[tasks.assets]
description = "Upload the new and changed files in assets/ to Roblox and write their IDs as typed code; needs asphalt.toml's creator and ASPHALT_API_KEY in .env"
env = { _.file = ".env" }
run = '''
if grep -q '^id = 0$' asphalt.toml; then
	echo 'Set [creator] in asphalt.toml first: your Roblox user ID, or type = "group" and the group ID.' >&2
	exit 1
fi
asphalt sync cloud
'''
