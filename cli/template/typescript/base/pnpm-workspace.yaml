# roblox-ts resolves packages through one node_modules folder in the game, so
# every package, including dependencies of dependencies, must sit in the
# top-level node_modules. pnpm's default layout hides those behind symlinks.
nodeLinker: hoisted

# eslint-plugin-roblox-ts pins an older typescript-eslint that rejects TypeScript 6.
# Share the project's typescript-eslint instead.
overrides:
  "@typescript-eslint/utils": "8.72.1"
  "@typescript-eslint/type-utils": "8.72.1"
  "@typescript-eslint/typescript-estree": "8.72.1"
  "@typescript-eslint/parser": "8.72.1"

# Install only versions published at least two weeks ago (in minutes), so a fresh,
# possibly compromised release never lands. Applies to every add and update.
minimumReleaseAge: 20160
minimumReleaseAgeExclude:
  - rbx-forge
  - "@rbx-forge/*"
  - "@ldgerrits/rogen"
