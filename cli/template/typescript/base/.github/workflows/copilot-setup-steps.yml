# Prepares GitHub Copilot's cloud coding agent: the pinned tools and packages, so it can run
# `mise run check` like any other agent. GitHub runs the job named copilot-setup-steps.
name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rur renders the stories in the check; the agent's machine has no GPU, so give it Mesa's
      # software Vulkan driver.
      # The runner's package lists are usually fresh enough; `apt-get update` takes most of this
      # step, so it runs only when the install fails without it.
      - run: |
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers ||
            { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers; }
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # pnpm's packages, kept between runs so the install downloads only what changed; each month starts afresh.
      - id: period
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ steps.period.outputs.month }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ steps.period.outputs.month }}-
      - run: mise run install
