name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@example.com
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@example.com

concurrency:
  # The nightly run is on main's ref too; it must not cancel, or wait for, a push's run.
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # changeset compares with the base branch: the full history brings origin/<base> along,
          # since persist-credentials: false leaves no token for a later git fetch.
          fetch-depth: 0
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
      - run: node .github/scripts/check-mise-pins.ts
      - run: mise run ci
      - name: Check for a changeset
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'renovate[bot]' && !startsWith(github.head_ref, 'renovate/') && !startsWith(github.head_ref, 'changeset-release/') }}
        run: |
          pnpm changeset status --since "origin/$BASE_REF" || {
            echo "::error::This pull request changes cli/src or cli/template without a changeset. Run \`pnpm changeset\`, pick the bump and say what changed for someone creating a game."
            exit 1
          }
        env:
          BASE_REF: ${{ github.base_ref }}

  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      create: ${{ steps.generate.outputs.create }}
      windows: ${{ steps.generate.outputs.windows }}
      macos: ${{ steps.generate.outputs.macos }}
      engine: ${{ steps.generate.outputs.engine }}
      run-create: ${{ steps.generate.outputs.run-create }}
      run-windows: ${{ steps.generate.outputs.run-windows }}
      run-macos: ${{ steps.generate.outputs.run-macos }}
      run-engine: ${{ steps.generate.outputs.run-engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and both its parents, to list what the pull request changes.
          fetch-depth: 2
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
      - id: generate
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed-files.txt" || : > "$RUNNER_TEMP/changed-files.txt"
            set -- --head-ref "$HEAD_REF" --changed-files "$RUNNER_TEMP/changed-files.txt"
          fi
          node .github/scripts/generate-matrix.ts --event "$EVENT" "$@" "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}

  create:
    name: Games (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.run-create == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.create) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mesa
        run: sh .github/scripts/mesa.sh key >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mesa-debs
          key: ${{ steps.mesa.outputs.key }}
      - run: sh .github/scripts/mesa.sh start
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile && pnpm --filter create-baseplate pack --pack-destination "$RUNNER_TEMP"
      # Node 22 before 22.18 strips types only with a flag, which the tests and scripts need.
      - name: Use the oldest supported Node
        if: matrix.node != ''
        run: |
          mise install "node@$MIN_NODE"
          echo "$(mise where "node@$MIN_NODE")/bin" >> "$GITHUB_PATH"
          echo "NODE_OPTIONS=--experimental-strip-types --disable-warning=ExperimentalWarning" >> "$GITHUB_ENV"
        env:
          MIN_NODE: ${{ matrix.node }}
      - name: CLI tests on the oldest supported Node
        if: matrix.node != ''
        run: node --version && node --test --test-reporter=spec test/*.test.ts
        working-directory: cli
      - run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/cli" "$RUNNER_TEMP"/create-baseplate-*.tgz
      - run: sh .github/scripts/mesa.sh wait
      - run: node .github/scripts/run-games.ts check
        env:
          GAMES: ${{ toJSON(matrix) }}
          CLI: ${{ runner.temp }}/cli/node_modules/create-baseplate/dist/index.js
          GAMES_DIR: ${{ runner.temp }}/games
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Games on Windows (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.run-windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.windows) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile && pnpm --filter create-baseplate pack --pack-destination "$RUNNER_TEMP"
      - run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/cli" "$RUNNER_TEMP"/create-baseplate-*.tgz
      - run: node .github/scripts/run-games.ts check
        env:
          GAMES: ${{ toJSON(matrix) }}
          CLI: ${{ runner.temp }}/cli/node_modules/create-baseplate/dist/index.js
          GAMES_DIR: ${{ runner.temp }}/games
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: Games on macOS (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.run-macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.macos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile && pnpm --filter create-baseplate pack --pack-destination "$RUNNER_TEMP"
      - run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/cli" "$RUNNER_TEMP"/create-baseplate-*.tgz
      - run: node .github/scripts/run-games.ts check
        env:
          GAMES: ${{ toJSON(matrix) }}
          CLI: ${{ runner.temp }}/cli/node_modules/create-baseplate/dist/index.js
          GAMES_DIR: ${{ runner.temp }}/games
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  engine:
    # GitHub keeps one waiting job per concurrency group: a third run to ask replaces the second,
    # which is cancelled; run it again.
    name: Games in Roblox
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: roblox-open-cloud
      cancel-in-progress: false
    # A job's `if` can't read secrets.
    if: needs.plan.outputs.run-engine == 'true' && vars.ROBLOX_UNIVERSE_ID != '' && vars.ROBLOX_PLACE_ID != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile && pnpm --filter create-baseplate build
      - run: node .github/scripts/run-games.ts prepare
        env:
          GAMES: ${{ needs.plan.outputs.engine }}
          CLI: cli/dist/index.js
          GAMES_DIR: ${{ runner.temp }}/games
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node .github/scripts/run-games.ts engine
        env:
          GAMES: ${{ needs.plan.outputs.engine }}
          GAMES_DIR: ${{ runner.temp }}/games
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}

  passed:
    # The jobs above have names that change with the add-on sets, so a branch ruleset can't require them.
    name: CI passed
    if: always()
    needs: [cli, plan, create, windows, engine]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Fail when a job failed or was cancelled
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e --arg event "$EVENT" -f .github/scripts/ci-passed.jq > /dev/null
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
