name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    name: Template (cli/template/base)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/template/base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
          working_directory: cli/template/base
        env:
          # mise downloads Rojo, Sloptor, ree and the rest from GitHub releases.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run install
      - run: mise run ci

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
      - run: mise run ci

  create:
    # What a user gets: create a game with the CLI, then run that game's own checks: with no
    # add-ons, each add-on alone, and two sets that use every question together.
    name: Created game (${{ matrix.addOns }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addOns:
          - ""
          - --state charm
          - --state reflex
          - --data profilestore
          - --data lapis
          - --entities components
          - --entities jecs
          - --ui vide
          - --assets asphalt
          - --release darklua
          - --places multi
          - --places multi --ui vide --state charm --data profilestore --entities jecs --assets asphalt --release darklua
          - --places multi --state reflex --data lapis --entities components
          - --state charm --data profilestore --entities components --release darklua
          - --state reflex --data lapis --entities jecs --assets asphalt
          - --ui vide --data profilestore --entities jecs --assets asphalt --release darklua
          - --ui vide --state charm --data lapis --entities components
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The package as npm would publish it: packing builds it (prepack), from this clean checkout.
      - run: pnpm install --frozen-lockfile && pnpm --filter create-baseplate pack --pack-destination "$RUNNER_TEMP"
      - run: npm exec --yes --package="$(ls "$RUNNER_TEMP"/create-baseplate-*.tgz)" -- create-baseplate "$RUNNER_TEMP/coin-rush" --json ${{ matrix.addOns }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run ci
        working-directory: ${{ runner.temp }}/coin-rush
      # The game's own CI runs this too, with --release.
      - if: contains(matrix.addOns, '--release')
        run: mise run release
        working-directory: ${{ runner.temp }}/coin-rush

  engine:
    # Created games' specs, *.engine.spec included, in a real Roblox server through Open Cloud:
    # what ree can't vouch for, such as an update that breaks only in the real engine. Set the
    # secret ROBLOX_OPEN_CLOUD_API_KEY and the variables ROBLOX_UNIVERSE_ID and ROBLOX_PLACE_ID
    # (in an experience made only for tests: each run uploads to the place, and the key can write
    # every place of its experience); without them this job only says it skipped.
    name: Created game in Roblox (${{ matrix.addOns }})
    needs: create
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The runs share the test place, so one at a time within a workflow run; the concurrency
      # group below keeps the same option set of two runs from overlapping.
      max-parallel: 1
      matrix:
        addOns:
          - ""
          - --state charm --data profilestore --entities components
          - --ui vide --state charm --data lapis --entities jecs
          - --state reflex --data lapis --entities jecs
          - --places multi --data profilestore --entities components
    concurrency:
      group: roblox-open-cloud-${{ strategy.job-index }}
      cancel-in-progress: false
    env:
      # Whether the key is set, not the key itself, which only the last step gets.
      OPEN_CLOUD: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY != '' }}
    steps:
      - if: env.OPEN_CLOUD != 'true'
        run: echo "::notice::Skipped the Roblox specs. Set ROBLOX_OPEN_CLOUD_API_KEY, ROBLOX_UNIVERSE_ID and ROBLOX_PLACE_ID to run them."
      - if: env.OPEN_CLOUD == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.OPEN_CLOUD == 'true'
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: env.OPEN_CLOUD == 'true'
        run: pnpm install --frozen-lockfile && pnpm --filter create-baseplate build
      - if: env.OPEN_CLOUD == 'true'
        run: node cli/dist/index.js "$RUNNER_TEMP/coin-rush" --json ${{ matrix.addOns }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: env.OPEN_CLOUD == 'true'
        run: mise run test:engine -- --backend open-cloud
        working-directory: ${{ runner.temp }}/coin-rush
        env:
          # The key only here: the steps before run installs and tools, which never see it.
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
