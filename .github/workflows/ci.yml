name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The first commit of a created game runs its hook, as on a person's machine.
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@example.com
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@example.com

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    name: Template (cli/template/base)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli/template/base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rur renders the stories in the check; GitHub's Linux machines have no GPU, so give it Mesa's
      # software Vulkan driver.
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
          working_directory: cli/template/base
        env:
          # mise downloads Rojo, Sloptor, ree and the rest from GitHub releases.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run install
      - run: mise run ci

  cli:
    name: CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
      # mise's own version is pinned by hand in several files; they must agree, with the right SHA-256s.
      - run: node .github/scripts/check-mise-pins.ts
      - run: mise run ci

  changeset:
    # A change to what create-baseplate ships (cli/src, cli/template) needs a changeset, so the next
    # release says what changed for someone creating a game. .changeset/config.json's
    # changedFilePatterns limits it to those folders. Renovate's updates and the release pull request
    # carry none, by design.
    name: Changeset
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'renovate[bot]' && !startsWith(github.head_ref, 'renovate/') && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # changeset compares with the base branch, so it needs the history back to it.
          fetch-depth: 0
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
      - run: pnpm install --frozen-lockfile
      - name: Check for a changeset
        run: |
          git fetch --no-tags origin "$BASE_REF"
          pnpm changeset status --since "origin/$BASE_REF" || {
            echo "::error::This pull request changes cli/src or cli/template without a changeset. Run \`pnpm changeset\`, pick the bump and say what changed for someone creating a game."
            exit 1
          }
        env:
          BASE_REF: ${{ github.base_ref }}

  matrix:
    # The sets of add-ons the jobs below create games with, generated from the CLI's questions and
    # the add-ons' conflicts (.github/scripts/generate-matrix.ts, which says what each set covers).
    name: Add-on sets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      create: ${{ steps.generate.outputs.create }}
      windows: ${{ steps.generate.outputs.windows }}
      engine: ${{ steps.generate.outputs.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
      - id: generate
        run: node .github/scripts/generate-matrix.ts

  create:
    # What a user gets: create a game with the CLI, then run that game's own checks: with no
    # add-ons, each add-on alone, every question answered together, and enough more that every two
    # choices meet in some game.
    name: Created game (${{ matrix.addOns }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.create) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rur renders the stories in the check; GitHub's Linux machines have no GPU, so give it Mesa's
      # software Vulkan driver.
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The package as npm would publish it: packing builds it (prepack), from this clean checkout.
      - run: pnpm install --frozen-lockfile && pnpm --filter create-baseplate pack --pack-destination "$RUNNER_TEMP"
      - run: npm exec --yes --package="$(ls "$RUNNER_TEMP"/create-baseplate-*.tgz)" -- create-baseplate "$RUNNER_TEMP/coin-rush" --json ${{ matrix.addOns }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run ci
        working-directory: ${{ runner.temp }}/coin-rush
      # The game's own CI runs this too, with --release.
      - if: contains(matrix.addOns, '--release')
        run: mise run release
        working-directory: ${{ runner.temp }}/coin-rush

  windows:
    # A created game on native Windows, where mise runs the tasks with cmd: the defaults, and every
    # option together. The tasks run their steps without a shell (scripts/each-place.ts).
    name: Created game on Windows (${{ matrix.addOns }})
    needs: matrix
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.windows) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile && pnpm --filter create-baseplate pack --pack-destination "$RUNNER_TEMP"
      - run: npm exec --yes --package="$(ls "$RUNNER_TEMP"/create-baseplate-*.tgz)" -- create-baseplate "$RUNNER_TEMP/coin-rush" --json ${{ matrix.addOns }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run ci
        working-directory: ${{ runner.temp }}/coin-rush
      - if: contains(matrix.addOns, '--release')
        run: mise run release
        working-directory: ${{ runner.temp }}/coin-rush

  engine:
    # Created games' specs, *.engine.spec included, in a real Roblox server through Open Cloud:
    # what ree can't vouch for, such as an update that breaks only in the real engine. Set the
    # secret ROBLOX_OPEN_CLOUD_API_KEY and the variables ROBLOX_UNIVERSE_ID and ROBLOX_PLACE_ID
    # (in an experience made only for tests: each run uploads to the place, and the key can write
    # every place of its experience); without the variables the job is skipped.
    name: Created game in Roblox (${{ matrix.addOns }})
    needs: [matrix, create]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The runs share the test place, so one at a time within a workflow run; the concurrency
      # group below keeps the same option set of two runs from overlapping.
      max-parallel: 1
      # No add-ons, and as few games as it takes for each choice to run once.
      matrix: ${{ fromJSON(needs.matrix.outputs.engine) }}
    concurrency:
      group: roblox-open-cloud-${{ strategy.job-index }}
      cancel-in-progress: false
    # Without the variables, GitHub shows the job as skipped, not passed. With them but no key, the
    # specs fail. (A job's `if` can't read secrets; only the last step gets the key.)
    if: vars.ROBLOX_UNIVERSE_ID != '' && vars.ROBLOX_PLACE_ID != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile && pnpm --filter create-baseplate build
      - run: node cli/dist/index.js "$RUNNER_TEMP/coin-rush" --json ${{ matrix.addOns }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run test:engine -- --backend open-cloud
        working-directory: ${{ runner.temp }}/coin-rush
        env:
          # The key only here: the steps before run installs and tools, which never see it.
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
