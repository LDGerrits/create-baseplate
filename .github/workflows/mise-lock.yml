name: Lock mise tools and Wally packages

# `mise install` refuses a tool that mise.lock doesn't list with its checksums, and the hosted
# Renovate app runs no post-upgrade commands, so it updates mise.toml but not mise.lock. A push with
# the default GITHUB_TOKEN doesn't start CI again.

on:
  push:
    branches: ["renovate/**"]
    paths: ["**/mise.toml", "**/mise.lock", "**/wally.toml"]

permissions:
  contents: write

concurrency:
  group: mise-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    name: Regenerate mise.lock and wally.lock
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_APP: ${{ secrets.BOT_APP_CLIENT_ID != '' }}
    steps:
      - id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
          install: false
      - name: Lock and push
        env:
          # Safe mode: mise reads the configs without running their hooks or env scripts, since the
          # branch's mise.toml is what changed.
          MISE_SAFE: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for lock in $(git ls-files -- '*mise.lock'); do
            (cd "$(dirname "$lock")" && mise trust --quiet . && mise lock)
          done
          # Writes wally.lock afresh only when wally.toml no longer matches it.
          for manifest in $(git ls-files -- '*wally.toml'); do
            (cd "$(dirname "$manifest")" && mise install --quiet github:UpliftGames/wally && mise exec -- wally install)
          done
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --quiet --message "Lock the updated tools and packages"
          git push
