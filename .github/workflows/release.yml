name: Release

# The changesets action reads the workflow's own sha (main's tip when this run started, which
# GitHub doesn't let a step override).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: CI passed on main's tip
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.tip.outputs.go }}
    steps:
      - id: tip
        run: |
          passed=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "CI passed") | .conclusion] | first // ""')
          if [ "$passed" != success ]; then
            echo "::notice::CI's \"CI passed\" job ended as '${passed:-missing}' for $SHA; nothing to release from it."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$tip" = "$SHA" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$SHA is no longer main's tip ($tip); its release waits for that commit's CI."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}

  release:
    name: Version or publish
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      HAS_APP: ${{ secrets.BOT_APP_CLIENT_ID != '' }}
    steps:
      - id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - id: still
        run: |
          tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$tip" = "$SHA" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$SHA is no longer main's tip ($tip); its release waits for that commit's CI."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
      - if: steps.still.outputs.go == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          # Empty until publishing is switched on: the action then only versions.
          publish-script: ${{ vars.NPM_PUBLISH == 'true' && 'pnpm release' || '' }}
          commit-message: Version packages
          pr-title: Version packages
          # The app's token, so the version pull request's CI runs (GitHub starts none for GITHUB_TOKEN's).
          github-token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
