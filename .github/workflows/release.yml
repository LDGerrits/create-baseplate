name: Release

# On main, changesets opens (and keeps up to date) a "Version packages" pull request from the
# changesets in .changeset/: the next version of create-baseplate and its CHANGELOG.md. Merging it
# publishes the new version to npm, once publishing is switched on: set the repository variable
# NPM_PUBLISH to true and add this workflow as a trusted publisher of create-baseplate on npmjs.com.
# npm then takes the package from this workflow alone, with provenance, and no token is stored.
#
# A pull request opened with the default GITHUB_TOKEN starts no workflows, so the version PR's CI
# wouldn't run. With the repository's GitHub App in BOT_APP_CLIENT_ID and BOT_APP_PRIVATE_KEY (the
# one the mise lock workflow uses; it needs Contents and Pull requests: read and write), the PR is
# opened as the app and its CI runs.
#
# The workflow starts when CI has finished on a push to main, and only goes on when CI passed (its
# "CI passed" job) and the commit is still main's tip: nothing untested reaches npm, and a stale run
# can't version or publish over a newer commit. It checks out the commit CI tested.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: CI passed on main's tip
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.tip.outputs.go }}
    steps:
      - id: tip
        run: |
          tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$tip" = "$SHA" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$SHA is no longer main's tip ($tip); its release waits for that commit's CI."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}

  release:
    name: Version or publish
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      HAS_APP: ${{ secrets.BOT_APP_CLIENT_ID != '' }}
    steps:
      - id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          # Empty until publishing is switched on: the action then only versions.
          publish-script: ${{ vars.NPM_PUBLISH == 'true' && 'pnpm release' || '' }}
          commit-message: Version packages
          pr-title: Version packages
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
